<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="xterm.css">
<style>
  @font-face { font-family: "JBM"; src: url("JetBrainsMono-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "JBM"; src: url("JetBrainsMono-Bold.ttf"); font-weight: 700; }
  /* Prompt and status-line icons (Powerlevel, starship): Nerd Font symbols. */
  @font-face { font-family: "NerdSymbols"; src: url("SymbolsNerdFontMono-Regular.ttf"); }
  /* Fixed: when the keyboard opens, Chromium scrolls the page to keep the
     focused textarea in view and never scrolls back. Nothing here scrolls but #wrap. */
  html, body { margin: 0; position: fixed; inset: 0; background: #24283b; overflow: hidden; }
  /* The terminal keeps the real terminal's size; when that is wider or
     taller than the phone even at the smallest font, this pans. */
  /* touch-action none: every drag is handled below (screen and scrollback
     as one, with momentum), none by the browser. */
  #wrap { position: absolute; inset: 0; overflow: auto; padding: 6px 6px 0 6px; box-sizing: border-box;
          -webkit-tap-highlight-color: transparent; touch-action: none; scrollbar-width: none; }
  #wrap::-webkit-scrollbar { display: none; }
  .xterm .xterm-viewport { background: #24283b !important; overflow-y: hidden; }
  /* The phone's own keyboard comes from the app, never from xterm's textarea. */
  .xterm-helper-textarea { pointer-events: none; }
  /* Pinching scales the drawn terminal live; the font changes when it ends. */
  #term { will-change: transform; }
  /* After a long press selects text: copy it, or let it go. */
  #selbar { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: none; gap: 2px;
            background: #1f2335; border-radius: 12px; padding: 4px; box-shadow: 0 6px 20px rgba(0,0,0,.45);
            font: 600 14px/1 system-ui, sans-serif; z-index: 2; }
  #selbar.on { display: flex; }
  #selbar button { all: unset; color: #c0caf5; padding: 12px 16px; border-radius: 8px; min-width: 44px; text-align: center; }
  #selbar button:active { background: #2e3c64; }
  #selbar .muted { color: #737aa2; }
</style>
</head>
<body>
<div id="wrap"><div id="term"></div></div>
<div id="selbar"><button id="sel-copy">Copy</button><button id="sel-all">Select all</button><button id="sel-x" class="muted" aria-label="Clear selection">✕</button></div>
<script src="xterm.js"></script>
<script src="addon-webgl.js"></script>
<script>
(() => {
  const BASE = 13, MIN = 5.5;            // font px: readable, and the smallest when fitting
  const ZMIN = 7, ZMAX = 24;             // what a pinch can choose
  // The app's bridge. Its methods only work called on the bridge object
  // itself (copied onto another object, WebView refuses them).
  const bridge = window.Android;
  const call = (name, ...args) => { if (bridge && typeof bridge[name] === "function") bridge[name](...args); };
  const android = {
    onStatus: (json) => call("onStatus", json), onTap: () => call("onTap"),
    onZoom: (px) => call("onZoom", px), copy: (text) => call("copy", text), haptic: () => call("haptic"),
  };
  const wrap = document.getElementById("wrap");
  const term = new Terminal({
    fontFamily: "JBM, NerdSymbols, monospace", fontSize: BASE, lineHeight: 1.0, scrollback: 1000,
    cursorBlink: true, allowProposedApi: true, convertEol: false, macOptionIsMeta: true,
    theme: {   // Tokyo Night Storm, as on the Mac
      background: "#24283b", foreground: "#c0caf5", cursor: "#c0caf5", cursorAccent: "#24283b",
      selectionBackground: "#2e3c64",
      black: "#1d202f", red: "#f7768e", green: "#9ece6a", yellow: "#e0af68",
      blue: "#7aa2f7", magenta: "#bb9af7", cyan: "#7dcfff", white: "#a9b1d6",
      brightBlack: "#414868", brightRed: "#ff899d", brightGreen: "#9fe044", brightYellow: "#faba4a",
      brightBlue: "#8db0ff", brightMagenta: "#c7a9ff", brightCyan: "#a4daff", brightWhite: "#c0caf5",
    },
  });
  term.open(document.getElementById("term"));
  // Drawn on the GPU: the DOM renderer redraws every row as text on each
  // scroll, which a phone can't keep up with. Back to it if WebGL is lost.
  try {
    const gl = new WebglAddon.WebglAddon();
    gl.onContextLoss(() => gl.dispose());
    term.loadAddon(gl);
  } catch (e) { /* no WebGL here: the DOM renderer stays */ }
  term.textarea.setAttribute("inputmode", "none");   // no soft keyboard from the web side
  term.textarea.setAttribute("tabindex", "-1");

  let ws = null, url = null, ended = false, retry = 0, retryTimer = 0;
  let real = { cols: term.cols, rows: term.rows };   // the core terminal's size
  let phone = { cols: 0, rows: 0 };                  // what fits this screen at the font
  let zoom = null;   // the font a pinch chose (remembered per terminal by the app); null: BASE, shrunk to fit
  let fixed = false; // the program owns the size (a herdr CLI pane): the phone never sends its own
  const enc = new TextEncoder();

  function status(state, extra) { android.onStatus(JSON.stringify(Object.assign({ state }, extra || {}))); }

  // The cell size at BASE, measured once while the font really is BASE
  // (scaling a small font's cells up is off: xterm rounds to pixels).
  let base = null, fontsReady = false;
  function measureBase() {
    if (!fontsReady) return;   // the fallback font's cells are a different size
    const screen = term.element.querySelector(".xterm-screen");
    const r = screen.getBoundingClientRect();
    if (term.options.fontSize === BASE && r.width) base = { w: r.width / term.cols, h: r.height / term.rows };
  }
  function cellAt(px) {
    if (!base) measureBase();
    return base ? { w: base.w * px / BASE, h: base.h * px / BASE } : { w: 0, h: 0 };
  }

  function view() { return { w: wrap.clientWidth - 12, h: wrap.clientHeight - 6 }; }

  // Shrinks the font until the real terminal's width fits the phone. A font
  // you pinched to stays as it is: a wider terminal then pans sideways.
  function fit() {
    const v = view(), c = cellAt(BASE);
    if (!c.w) return;
    const px = zoom || Math.max(MIN, Math.min(BASE, Math.floor((BASE * v.w / (real.cols * c.w)) * 2) / 2));
    if (term.options.fontSize !== px) term.options.fontSize = px;
    const driving = !fixed && Math.abs(real.cols - phone.cols) <= 1 && Math.abs(real.rows - phone.rows) <= 1;
    status("size", { cols: real.cols, rows: real.rows, phoneCols: phone.cols, phoneRows: phone.rows, driving, font: px });
  }

  // What fits this screen at the readable font; sent so that typing here
  // gives the terminal the phone's size. Sent once the layout settles: the
  // keyboard slides in over ~250 ms, and each step would reflow the program.
  let resizeTimer = null;
  let sent = { cols: 0, rows: 0 };   // the size the server has for this phone
  let keyboardUp = false;            // told by the app (hr.keyboard)
  function sendSize() {
    clearTimeout(resizeTimer);
    resizeTimer = null;
    if (fixed || (phone.cols === sent.cols && phone.rows === sent.rows)) return;
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: "resize", cols: phone.cols, rows: phone.rows }));
      sent = { cols: phone.cols, rows: phone.rows };
    }
  }
  function measurePhone() {
    const v = view(), c = cellAt(zoom || BASE);
    if (!c.w || wrap.clientWidth < 50 || wrap.clientHeight < 50) return;   // not laid out (or hidden): no size to give
    const next = { cols: Math.max(20, Math.floor(v.w / c.w)), rows: Math.max(5, Math.floor(v.h / c.h)) };
    // With the keyboard up the rows stay: the terminal scrolls under it
    // (herdr-core grows a terminal by adding blank rows at the bottom, so a
    // shrink and grow per keyboard would leave a gap until the program redraws).
    if (keyboardUp && sent.rows) next.rows = sent.rows;
    if (next.cols === phone.cols && next.rows === phone.rows) return;
    phone = next;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(sendSize, 300);
  }

  function send(text) {
    if (ws && ws.readyState === 1 && text) ws.send(enc.encode(text));
  }
  // What xterm itself sends: mouse reports go to the program like keys;
  // everything else answers the display attach's own queries (colors, device
  // attributes), so it goes back to that attach, not to the program.
  const MOUSE = /^\x1b\[(<\d+;\d+;\d+[Mm]|M[\s\S]{3})/;
  term.onData((d) => {
    if (MOUSE.test(d)) send(d);
    else if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "reply", data: d }));
  });

  function dropSocket() { if (ws) { const old = ws; ws = null; old.close(); } }

  function connect() {
    clearTimeout(retryTimer);
    if (!url || ended || ws) return;
    measurePhone();
    // Not on screen yet: wait for a size rather than give the terminal a made-up one.
    if (!phone.cols) { retryTimer = setTimeout(connect, 150); return; }
    status("connecting");
    const u = fixed ? url : url + "&cols=" + phone.cols + "&rows=" + phone.rows;
    sent = { cols: phone.cols, rows: phone.rows };
    const sock = new WebSocket(u);   // a socket replaced or closed by hand goes quiet
    ws = sock;
    sock.binaryType = "arraybuffer";
    sock.onopen = () => { if (ws !== sock) return; retry = 0; term.reset(); status("live"); };
    sock.onmessage = (e) => {
      if (ws !== sock) return;
      if (typeof e.data !== "string") { term.write(new Uint8Array(e.data)); return; }
      const m = JSON.parse(e.data);
      if (m.type === "size") {
        real = { cols: m.cols, rows: m.rows };
        // A fresh full paint follows at the new size: start from a clean
        // terminal so the copy matches the Mac's exactly (scrollback included).
        if (m.repaint) term.reset();
        term.resize(m.cols, m.rows);
        fit();
        follow();
      } else if (m.type === "exit") {
        if (/ended/.test(m.reason)) { ended = true; status("ended", { reason: m.reason }); }
      }
    };
    sock.onclose = () => {
      if (ws !== sock) return;
      ws = null;
      if (ended) return;
      retry++;
      const wait = 500 * Math.min(retry, 6);
      status("reconnecting", { inMs: wait, attempt: retry });
      retryTimer = setTimeout(connect, wait);
    };
  }

  // Keys from the app's key bar, encoded the way the program asked for
  // (application cursor keys turn arrows into ESC O A…).
  const app = () => term.modes.applicationCursorKeysMode;
  const KEYS = {
    esc: () => "\x1b", tab: () => "\t", enter: () => "\r", backspace: () => "\x7f",
    up: () => app() ? "\x1bOA" : "\x1b[A", down: () => app() ? "\x1bOB" : "\x1b[B",
    right: () => app() ? "\x1bOC" : "\x1b[C", left: () => app() ? "\x1bOD" : "\x1b[D",
    home: () => "\x1b[H", end: () => "\x1b[F", pgup: () => "\x1b[5~", pgdn: () => "\x1b[6~", del: () => "\x1b[3~",
    shifttab: () => "\x1b[Z",
  };

  // Touch: a tap opens the phone's keyboard (in the app); a drag scrolls.
  // The screen (#wrap, when the terminal is taller or wider than the phone)
  // and the scrollback (xterm's lines) move as one, and a flick keeps going
  // and slows down like any Android list. (xterm's own touch handling jumps
  // line by line and stops dead when the finger lifts: it is kept out.)
  const rowH = () => term.element.querySelector(".xterm-screen").getBoundingClientRect().height / term.rows || BASE;
  let touch = null, flingFrame = 0, lineRest = 0, lastUserScroll = 0;

  // Scrolls by pixels; dy > 0 goes towards newer lines. Says whether anything moved.
  function scrollBy(dx, dy) {
    let moved = false;
    if (dx) { const l = wrap.scrollLeft; wrap.scrollLeft += dx; moved = wrap.scrollLeft !== l; }
    if (dy) {
      const buf = term.buffer.active;
      const inScrollback = buf.viewportY < buf.baseY;
      if ((dy > 0 && inScrollback) || (dy < 0 && wrap.scrollTop <= 0)) {
        if (dy < 0 && buf.viewportY <= 0) {
          lineRest = 0;                     // the oldest line: nothing further up
        } else {
          lineRest += dy;                   // whole lines; the rest waits for the next move
          const n = Math.trunc(lineRest / rowH());
          if (n) { lineRest -= n * rowH(); term.scrollLines(n); }
          moved = true;
        }
      } else {
        const t = wrap.scrollTop; wrap.scrollTop += dy; moved = moved || wrap.scrollTop !== t;
      }
    }
    if (moved) lastUserScroll = performance.now();
    return moved;
  }

  function stopFling() { cancelAnimationFrame(flingFrame); flingFrame = 0; }

  // Keeps going at the speed the finger left with, slowing down evenly.
  function startFling(vx, vy) {   // px per ms
    let last = performance.now();
    const step = (now) => {
      const dt = Math.min(48, now - last);
      last = now;
      const decay = Math.pow(0.996, dt);  // about 0.94 per 60 Hz frame
      vx *= decay; vy *= decay;
      if (Math.abs(vx) < 0.02 && Math.abs(vy) < 0.02) { flingFrame = 0; return; }
      if (!scrollBy(vx * dt, vy * dt)) { flingFrame = 0; return; }  // reached an end
      flingFrame = requestAnimationFrame(step);
    };
    flingFrame = requestAnimationFrame(step);
  }

  // Long press: selects the word under the finger; dragging on extends the
  // selection, and the bar at the top copies it.
  const termEl = document.getElementById("term");
  const selbar = document.getElementById("selbar");
  let pressTimer = 0, anchor = null;   // anchor: the first word, as cell indexes
  function cellAt2(x, y) {
    const r = term.element.querySelector(".xterm-screen").getBoundingClientRect();
    const col = Math.max(0, Math.min(term.cols - 1, Math.floor((x - r.left) / (r.width / term.cols))));
    const row = Math.max(0, Math.min(term.rows - 1, Math.floor((y - r.top) / (r.height / term.rows))));
    return { col, row: row + term.buffer.active.viewportY };
  }
  const index = (c) => c.row * term.cols + c.col;
  function wordAt(c) {
    const line = term.buffer.active.getLine(c.row);
    const word = (i) => {
      const cell = line && line.getCell(i);
      if (!cell) return false;
      if (cell.getWidth() === 0) return true;   // a wide character's second half
      return /^[^\s│┃║|"'`()\[\]{}<>,;]+$/.test(cell.getChars());   // "" is an empty cell
    };
    let a = c.col, b = c.col;
    if (word(c.col)) {
      while (a > 0 && word(a - 1)) a--;
      while (b < term.cols - 1 && word(b + 1)) b++;
    }
    return { start: index({ row: c.row, col: a }), end: index({ row: c.row, col: b }) };
  }
  function selectRange(start, end) {
    term.select(start % term.cols, Math.floor(start / term.cols), end - start + 1);
  }
  function startSelect(t) {
    t.selecting = true;
    anchor = wordAt(cellAt2(t.x0, t.y0));
    selectRange(anchor.start, anchor.end);
    selbar.classList.remove("on");
    android.haptic();
  }
  function extendSelect(x, y) {
    // Near the top or bottom edge, the text scrolls to select further.
    const r = wrap.getBoundingClientRect();
    if (y < r.top + 24) scrollBy(0, -rowH() / 2);
    else if (y > r.bottom - 24) scrollBy(0, rowH() / 2);
    const i = index(cellAt2(x, y));
    if (i >= anchor.start) selectRange(anchor.start, Math.max(i, anchor.end));
    else selectRange(i, anchor.end);
  }
  function clearSelection() { term.clearSelection(); anchor = null; selbar.classList.remove("on"); }
  const onButton = (id, f) => document.getElementById(id).addEventListener("click", (e) => { e.stopPropagation(); f(); });
  onButton("sel-copy", () => { const text = term.getSelection(); if (text) android.copy(text); clearSelection(); });
  onButton("sel-all", () => { term.selectAll(); selbar.classList.add("on"); });
  onButton("sel-x", clearSelection);

  // Two fingers: pinch to make the text bigger or smaller.
  let pinch = null;   // { d0, z0, scale }
  const spread = (e) => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  function startPinch(e) {
    const r = termEl.getBoundingClientRect();
    const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2, my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    termEl.style.transformOrigin = (mx - r.left) + "px " + (my - r.top) + "px";
    pinch = { d0: spread(e) || 1, z0: term.options.fontSize, scale: 1 };
  }
  function movePinch(e) {
    pinch.scale = Math.max(ZMIN / pinch.z0, Math.min(ZMAX / pinch.z0, spread(e) / pinch.d0));
    termEl.style.transform = "scale(" + pinch.scale + ")";
  }
  function endPinch() {
    const z = Math.max(ZMIN, Math.min(ZMAX, Math.round(pinch.z0 * pinch.scale * 2) / 2));
    termEl.style.transform = "";
    pinch = null;
    if (Math.abs(z - term.options.fontSize) < 0.5) return;
    hr.zoom(z);
    android.onZoom(z);
  }

  const opts = { capture: true, passive: false };
  wrap.addEventListener("touchstart", (e) => {
    e.stopPropagation();   // not to xterm
    e.preventDefault();    // nor the mouse events a browser makes up from touches (they clear a selection)
    stopFling();           // a touch catches a flick, like any list
    clearTimeout(pressTimer);
    if (e.touches.length === 2 && !(touch && touch.selecting)) { touch = null; startPinch(e); return; }
    if (e.touches.length !== 1 || pinch) { return; }
    const t = e.touches[0];
    touch = { x0: t.clientX, y0: t.clientY, x: t.clientX, y: t.clientY, moved: false, selecting: false, samples: [{ t: e.timeStamp, x: t.clientX, y: t.clientY }] };
    const mine = touch;
    pressTimer = setTimeout(() => { if (touch === mine && !mine.moved) startSelect(mine); }, 450);
  }, opts);
  wrap.addEventListener("touchmove", (e) => {
    e.stopPropagation();
    if (pinch) { e.preventDefault(); if (e.touches.length === 2) movePinch(e); return; }
    if (!touch || e.touches.length !== 1) return;
    e.preventDefault();
    const t = e.touches[0];
    if (touch.selecting) { extendSelect(t.clientX, t.clientY); return; }
    if (!touch.moved && Math.hypot(t.clientX - touch.x0, t.clientY - touch.y0) < 8) return;
    touch.moved = true;
    clearTimeout(pressTimer);
    scrollBy(touch.x - t.clientX, touch.y - t.clientY);
    touch.x = t.clientX; touch.y = t.clientY;
    touch.samples.push({ t: e.timeStamp, x: t.clientX, y: t.clientY });
    while (touch.samples.length > 2 && e.timeStamp - touch.samples[0].t > 100) touch.samples.shift();
  }, opts);
  wrap.addEventListener("touchend", (e) => {
    e.stopPropagation();
    e.preventDefault();
    clearTimeout(pressTimer);
    if (pinch) { if (e.touches.length < 2) endPinch(); return; }   // the other finger is ignored until it lifts
    if (!touch) return;
    const t = touch;
    touch = null;
    if (t.selecting) { if (term.hasSelection()) selbar.classList.add("on"); return; }
    if (!t.moved) {
      if (term.hasSelection()) clearSelection();   // a tap lets a selection go first
      else android.onTap();
      return;
    }
    // The speed over the last ~100 ms, unless the finger stopped before lifting.
    const a = t.samples[0], b = t.samples[t.samples.length - 1], dt = b.t - a.t;
    if (dt <= 0 || e.timeStamp - b.t > 80) return;
    const vx = (a.x - b.x) / dt, vy = (a.y - b.y) / dt;
    if (Math.hypot(vx, vy) > 0.25) startFling(vx, vy);
  }, opts);
  wrap.addEventListener("touchcancel", (e) => {
    e.stopPropagation(); clearTimeout(pressTimer); touch = null;
    if (pinch) { termEl.style.transform = ""; pinch = null; }
  }, opts);

  // Keeps the cursor's row on screen inside #wrap (the terminal can be taller
  // than the space the keyboard leaves), and the top when it all fits.
  let followQueued = false;
  function follow() {
    if (followQueued) return;
    followQueued = true;
    requestAnimationFrame(() => {
      followQueued = false;
      window.scrollTo(0, 0);
      // Not while you scroll or read back: output (a spinner) would yank the
      // view away from under your finger. Typing brings it back.
      if (touch || flingFrame || performance.now() - lastUserScroll < 4000) return;
      if (term.buffer.active.viewportY < term.buffer.active.baseY) return;
      // The row height as drawn right now.
      const h = term.element.querySelector(".xterm-screen").getBoundingClientRect().height / term.rows;
      if (!h) return;
      if (wrap.scrollHeight <= wrap.clientHeight + 1) { wrap.scrollTop = 0; return; }
      const top = 6 + term.buffer.active.cursorY * h;
      if (top + h > wrap.scrollTop + wrap.clientHeight) wrap.scrollTop = top + h - wrap.clientHeight + 4;
      else if (top < wrap.scrollTop) wrap.scrollTop = Math.max(0, top - 4);
    });
  }
  term.onWriteParsed(follow);
  window.addEventListener("scroll", () => window.scrollTo(0, 0));

  new ResizeObserver(() => { measurePhone(); fit(); follow(); }).observe(wrap);

  window.hr = {
    // zoom: the font pinched to before, for this terminal; 0 for the default.
    // fixedSize: the terminal keeps its own size (a herdr CLI pane).
    connect(wsUrl, z, fixedSize) {
      url = wsUrl; ended = false; fixed = !!fixedSize;
      dropSocket();
      zoom = z > 0 ? Math.max(ZMIN, Math.min(ZMAX, z)) : null;
      // Load the terminal's fonts first (document.fonts.ready doesn't wait for
      // a font nothing has asked for yet), make xterm measure its cells again
      // with them, then size for this phone and go.
      Promise.all(["13px JBM", "bold 13px JBM", "13px NerdSymbols"].map((f) => document.fonts.load(f).catch(() => {}))).then(() => {
        if (!base) {
          fontsReady = true;
          term.options.fontSize = BASE + 1;   // a change makes xterm re-measure
          term.options.fontSize = BASE;
          requestAnimationFrame(() => requestAnimationFrame(() => { measureBase(); phone = { cols: 0, rows: 0 }; measurePhone(); fit(); connect(); }));
        } else connect();
      });
    },
    keyboard(up) {
      keyboardUp = up;
      if (up) {
        // A shrink measured while the keyboard slid in hasn't gone out yet: undo it.
        if (sent.rows) phone = { cols: phone.cols, rows: sent.rows };
        if (phone.cols === sent.cols && phone.rows === sent.rows) { clearTimeout(resizeTimer); resizeTimer = null; }
      } else {
        measurePhone();
      }
      follow();
    },
    input(text) { lastUserScroll = 0; stopFling(); term.scrollToBottom(); send(text); follow(); },
    // The rows on screen, for tests in a desktop browser.
    screen() {
      const b = term.buffer.active, out = [];
      for (let i = 0; i < term.rows; i++) { const l = b.getLine(b.viewportY + i); out.push(l ? l.translateToString(true) : ""); }
      return { rows: out, viewportY: b.viewportY, baseY: b.baseY, wrapTop: wrap.scrollTop, renderer: term.element.querySelector(".xterm-screen canvas") ? "webgl" : "dom" };
    },
    key(name) { const k = KEYS[name]; if (k) { lastUserScroll = 0; stopFling(); term.scrollToBottom(); send(k()); follow(); } },
    paste(text) { term.paste(text); },
    // A font size; 0 back to the default. Typing here then gives the terminal
    // what fits the phone at that size.
    zoom(z) {
      zoom = z > 0 ? Math.max(ZMIN, Math.min(ZMAX, z)) : null;
      measurePhone(); fit(); follow();
    },
    selection() { return term.getSelection(); },
    _t: term,   // for tests in a desktop browser
    close() { ended = true; clearTimeout(retryTimer); dropSocket(); },
    // The network changed (Tailscale back on): try now, not at the next retry.
    retry() { if (!ws && url && !ended) connect(); },
  };
  status("ready");
  // Debugging in a desktop browser: terminal.html#ws=<attach URL with token>
  const m = location.hash.match(/^#ws=(.+)$/);
  if (m) hr.connect(decodeURIComponent(m[1]));
})();
</script>
</body>
